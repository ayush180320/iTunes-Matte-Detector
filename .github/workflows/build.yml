name: Build Standalone Single-File App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download FFmpeg Binaries
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        Copy-Item "ffmpeg_extracted\*\bin\ffmpeg.exe" -Destination "."
        Copy-Item "ffmpeg_extracted\*\bin\ffprobe.exe" -Destination "."

    - name: Download and Extract libmpv
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Download the MPV engine using GitHub CLI directly on the cloud server
        gh release download --repo zhongfly/mpv-winbuild --pattern "*mpv-dev-x86_64*.7z" --dir mpv_dl
        # Windows runners have 7z pre-installed. Unzip it.
        7z x mpv_dl\*.7z -ompv_extracted
        # Move the DLL to our main folder and rename it so python-mpv finds it
        Copy-Item "mpv_extracted\*\libmpv-2.dll" -Destination "mpv-2.dll"

    - name: Build Single Executable with PyInstaller
      # --onefile forces everything into a single .exe
      run: pyinstaller --noconsole --onefile --add-binary "mpv-2.dll;." --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." matte_detector.py
      
    - name: Upload Single EXE
      uses: actions/upload-artifact@v4
      with:
        name: StudioMatteApp-Standalone
        path: dist/matte_detector.exe
