name: Build Windows EXE with FFmpeg

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download FFmpeg Binaries
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        Copy-Item "ffmpeg_extracted\*\bin\ffmpeg.exe" -Destination "."
        Copy-Item "ffmpeg_extracted\*\bin\ffprobe.exe" -Destination "."

    - name: Build with PyInstaller
      run: pyinstaller --noconsole --onefile --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --hidden-import PyQt6.QtMultimedia --hidden-import PyQt6.QtMultimediaWidgets matte_detector.py
      
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudioMatteApp-Standalone
        path: dist/matte_detector.exe
