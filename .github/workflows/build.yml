name: Build Standalone Single-File App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Hard-Install Dependencies
      # Bypassing requirements.txt to absolutely guarantee these are installed
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 python-mpv
        
    - name: Download FFmpeg Binaries
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        7z e ffmpeg.zip -offmpeg_extracted ffmpeg.exe ffprobe.exe -r -aoa
        Copy-Item "ffmpeg_extracted\ffmpeg.exe" -Destination "."
        Copy-Item "ffmpeg_extracted\ffprobe.exe" -Destination "."

    - name: Download and Extract libmpv
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Force-fetch the absolute newest release tag
        $LATEST_TAG = (gh api repos/shinchiro/mpv-winbuild-cmake/releases | ConvertFrom-Json)[0].tag_name
        gh release download $LATEST_TAG --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-*.7z" --dir mpv_dl
        
        # Extract and forcefully overwrite
        7z e mpv_dl\*.7z -ompv_extracted *mpv-*.dll -r -aoa
        
        # Find the DLL and rename it
        $dll = Get-ChildItem "mpv_extracted\*mpv-*.dll" | Select-Object -First 1
        Copy-Item $dll.FullName -Destination "mpv-2.dll"

    - name: Build Single Executable with PyInstaller
      # --collect-all is the most aggressive way to force PyInstaller to include a module
      run: pyinstaller --noconsole --onefile --collect-all mpv --add-binary "mpv-2.dll;." --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." matte_detector.py
      
    - name: Upload Single EXE
      uses: actions/upload-artifact@v4
      with:
        name: StudioMatteApp-Standalone
        path: dist/matte_detector.exe
