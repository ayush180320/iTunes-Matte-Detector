name: Build Standalone Single-File App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download FFmpeg Binaries
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        
        # 7z 'e' command extracts files "flatly", ignoring any internal folder structures. 
        # The '-r' flag forces it to search the entire zip until it finds the .exe files.
        7z e ffmpeg.zip -offmpeg_extracted ffmpeg.exe ffprobe.exe -r
        Copy-Item "ffmpeg_extracted\ffmpeg.exe" -Destination "."
        Copy-Item "ffmpeg_extracted\ffprobe.exe" -Destination "."

    - name: Download and Extract libmpv
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 1. Query the API directly to force-fetch the absolute newest release tag, bypassing the "Latest" badge rule.
        $LATEST_TAG = (gh api repos/shinchiro/mpv-winbuild-cmake/releases | ConvertFrom-Json)[0].tag_name
        gh release download $LATEST_TAG --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-*.7z" --dir mpv_dl
        
        # 2. Extract the DLL flatly, no matter how deep it is hidden inside the .7z archive.
        7z e mpv_dl\*.7z -ompv_extracted *mpv-*.dll -r
        
        # 3. Find the DLL (whether they named it libmpv-2.dll, mpv-2.dll, etc.) and standardize its name for Python.
        $dll = Get-ChildItem "mpv_extracted\*mpv-*.dll" | Select-Object -First 1
        Copy-Item $dll.FullName -Destination "mpv-2.dll"

    - name: Build Single Executable with PyInstaller
      run: pyinstaller --noconsole --onefile --add-binary "mpv-2.dll;." --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." matte_detector.py
      
    - name: Upload Single EXE
      uses: actions/upload-artifact@v4
      with:
        name: StudioMatteApp-Standalone
        path: dist/matte_detector.exe
